<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>InnResto</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      Thème posé AVANT le premier rendu. Sans ce script, la page s'afficherait
      en sombre le temps que l'application démarre, puis basculerait en clair
      sous les yeux de l'utilisateur. Volontairement minimal et sans dépendance.
    -->
    <script>
      (function () {
        try {
          var memorise = localStorage.getItem('inresto.theme');
          var theme =
            memorise === 'dark' || memorise === 'light'
              ? memorise
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
